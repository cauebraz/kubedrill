set -g mouse on
set -g set-clipboard on
set -as terminal-features ",*:clipboard"
bind m if-shell -F "#{mouse}" "set -g mouse off ; display-message 'mouse off: drag selects text, Cmd-c copies; C-b m turns it back on'" "set -g mouse on ; display-message 'mouse on: wheel scrolls panes, drag resizes them'"
set -g default-terminal "screen-256color"
set -g history-limit 20000
set -g base-index 1
set -g escape-time 10
set -g status on
set -g status-interval 5
set -g status-left "#[bold] kubedrill "
set -g status-right "#{?mouse,C-b m: mouse off to copy,mouse off: C-b m turns it on}  cluster: #(printenv KUBEDRILL_CLUSTER) "
set -g status-left-length 20
set -g status-right-length 80
