apiVersion: batch/v1
kind: CronJob
metadata:
  name: invoice
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: invoice
    app.kubernetes.io/part-of: billing
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: {{ .Vars.policy }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: invoice
        app.kubernetes.io/part-of: billing
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: invoice
            app.kubernetes.io/part-of: billing
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 1
          containers:
            - name: export
              image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
              command:
                - sh
                - -c
                - |
                  echo "invoice export $HOSTNAME: start, writing /exports/invoices.csv"
                  i=1
                  while [ "$i" -le {{ .Vars.batches }} ]; do
                    echo "invoice export $HOSTNAME: batch $i of {{ .Vars.batches }} appended"
                    sleep 5
                    i=$((i + 1))
                  done
                  echo "invoice export $HOSTNAME: done, file closed"
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  memory: 16Mi
---
