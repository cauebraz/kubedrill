checks:
  - id: forbid-overlap
    description: cronjob invoice skips a run while the previous one is active (concurrencyPolicy Forbid)
    why: >-
      Allow starts a second Job next to a running one and Replace deletes the
      running one mid-write; only Forbid guarantees that one export owns the
      file from start to end.
    critical: true
    spoiler: true
    weight: 2
    resource:
      apiVersion: batch/v1
      kind: CronJob
      namespace: "{{ .Namespace }}"
      name: invoice
    path: "{.spec.concurrencyPolicy}"
    equals: Forbid

  - id: one-active-job
    description: at most one invoice Job is active
    why: >-
      Every active Job runs its own export against the same file; two at once
      interleave their writes, and the next finance close reads a corrupted
      file.
    script: >-
      kubectl -n "$TASK_NS" get jobs -l app.kubernetes.io/name=invoice
      -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.active}{"\n"}{end}'
      | awk '$2 > 0 {n++} END {print n+0}'
    exit_code: 0
    lte: "1"

  - id: single-scheduler
    description: cronjob invoice is the only unsuspended CronJob that runs the invoice export
    why: >-
      A second CronJob on the same schedule starts its own Job every time, and
      the concurrencyPolicy of one CronJob never sees the Jobs of another.
    script: >-
      kubectl -n "$TASK_NS" get cronjobs -l app.kubernetes.io/name=invoice
      -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.suspend}{"\n"}{end}'
      | awk '$2 != "true" {printf "%s%s", s, $1; s=" "} END {print ""}'
    exit_code: 0
    equals: invoice
    spoiler: true
