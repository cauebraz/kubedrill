checks:
  - id: pvc-bound
    description: persistentvolumeclaim uploads-data is Bound
    why: >-
      A claim that is not Bound has no volume behind it; every pod that mounts
      it stays Pending, and nothing the app writes can survive a restart.
    critical: true
    resource:
      apiVersion: v1
      kind: PersistentVolumeClaim
      namespace: "{{ .Namespace }}"
      name: uploads-data
    path: "{.status.phase}"
    equals: Bound

  - id: ready-replicas
    description: deployment uploads has 1 ready replica
    why: >-
      readyReplicas counts pods whose Ready condition is true; 0 means the
      upload service accepts no file and the storefront shows broken images.
    depends_on: [pvc-bound]
    weight: 2
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: uploads
    path: "{.status.readyReplicas}"
    equals: "1"

  - id: uploads-rolled-out
    description: "deployment uploads finished rolling out: every pod runs the current template"
    why: >-
      Old pods that still pass readiness keep the ready count up while a
      broken new template crash-loops; only a finished rollout proves every
      pod runs the current template.
    depends_on: [ready-replicas]
    rollout:
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: uploads

  - id: data-writable
    description: the uploads pod writes and reads a file on claim uploads-data mounted at /data
    why: >-
      A Ready pod proves the server listens, not that uploads land on the
      persistent volume; a write and a read on the uploads-data mount at
      /data is what a customer upload does, and an emptyDir loses it.
    depends_on: [ready-replicas]
    script: |
      vol=$(kubectl -n "$TASK_NS" get deployment uploads -o jsonpath='{.spec.template.spec.containers[?(@.name=="uploads")].volumeMounts[?(@.mountPath=="/data")].name}')
      claim=$(kubectl -n "$TASK_NS" get deployment uploads -o jsonpath="{.spec.template.spec.volumes[?(@.name==\"$vol\")].persistentVolumeClaim.claimName}")
      if [ -z "$vol" ] || [ "$claim" != "uploads-data" ]; then
        echo "deployment uploads: expected /data on claim uploads-data, got volume '$vol' with claim '$claim'"
        exit 1
      fi
      kubectl -n "$TASK_NS" exec deploy/uploads -c uploads -- sh -c 'grep -q " /data " /proc/mounts || { echo "/data is not a mount"; exit 1; }; echo kubedrill-write-ok > /data/.kubedrill-check && cat /data/.kubedrill-check && rm -f /data/.kubedrill-check'
    exit_code: 0
    contains: kubedrill-write-ok
