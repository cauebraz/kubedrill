apiVersion: apps/v1
kind: Deployment
metadata:
  name: uploads
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: uploads
    app.kubernetes.io/part-of: shop
    team: storefront
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: uploads
  template:
    metadata:
      labels:
        app.kubernetes.io/name: uploads
        app.kubernetes.io/part-of: shop
        team: storefront
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: uploads
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["httpd", "-f", "-p", "8080", "-h", "/data"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Vars.claim_name }}
