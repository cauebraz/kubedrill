apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-api
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: session-api
    app.kubernetes.io/part-of: sessions
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: session-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: session-api
        app.kubernetes.io/part-of: sessions
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: api
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command:
            - sh
            - -c
            - |
              while true; do
                ok=0
                while read -r node; do
                  [ -n "$node" ] || continue
                  host=${node%:*}
                  port=${node##*:}
                  if ! nslookup "$host" >/dev/null 2>&1; then
                    echo "session-api: redis node $node: name does not resolve"
                  elif ! nc -z -w 2 "$host" "$port" 2>/dev/null; then
                    echo "session-api: redis node $node: resolves, connection to port $port failed"
                  else
                    echo "session-api: redis node $node: connected"
                    ok=$((ok + 1))
                  fi
                done < /etc/session-api/redis-nodes
                if [ "$ok" -eq 3 ]; then
                  echo "session-api: 3 of 3 redis nodes reachable, sessions stored"
                else
                  echo "session-api: $ok of 3 redis nodes reachable, logins fail with 503"
                fi
                sleep 10
              done
          volumeMounts:
            - name: config
              mountPath: /etc/session-api
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: session-api-config
