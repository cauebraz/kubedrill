checks:
  - id: deploy-ready
    description: deployment api has at least 1 ready replica
    why: >-
      readyReplicas counts the api pods that pass readiness; an HPA can only
      add pods to a Deployment that already runs, and 0 here is an outage
      before any scaling question.
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: api
    path: "{.status.readyReplicas}"
    gte: "1"

  - id: scaling-active
    description: hpa api has condition ScalingActive True
    why: >-
      ScalingActive False means the HPA controller cannot compute a desired
      replica count, so api stays at its current size however high the load
      climbs.
    critical: true
    weight: 2
    resource:
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      namespace: "{{ .Namespace }}"
      name: api
    path: '{.status.conditions[?(@.type=="ScalingActive")].status}'
    equals: "True"

  - id: current-metric
    description: hpa api reports a current metric value
    why: >-
      status.currentMetrics is what the controller compares with the 50%
      target; an empty value is the <unknown> in the TARGETS column and no
      scaling decision is made.
    depends_on: [scaling-active]
    resource:
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      namespace: "{{ .Namespace }}"
      name: api
    path: "{.status.currentMetrics[*].resource.current.averageValue}"
    not_empty: true

  - id: hpa-keeps-intent
    description: hpa api resizes deployment api by the rule the ticket asks for, between 1 and 4 pods
    why: >-
      The team sized api on CPU with a 1 to 4 pod range; an HPA that resizes
      another workload, follows another resource or drops the range reports
      a value and still leaves api unscaled when CPU saturates.
    depends_on: [scaling-active]
    resource:
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      namespace: "{{ .Namespace }}"
      name: api
    path: "{.spec.scaleTargetRef.kind}/{.spec.scaleTargetRef.name} min={.spec.minReplicas} max={.spec.maxReplicas} metrics={.spec.metrics[*].resource.name} target={.spec.metrics[*].resource.target.averageUtilization}"
    matches: '^Deployment\s*/\s*api\s+min=\s*1\s+max=\s*4\s+metrics=\s*cpu\s+target=\s*50$'
    spoiler: true
