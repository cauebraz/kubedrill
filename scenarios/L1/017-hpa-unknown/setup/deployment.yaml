apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: orders
    team: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: orders
        team: orders
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: api
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests: {{ .Vars.requests }}
