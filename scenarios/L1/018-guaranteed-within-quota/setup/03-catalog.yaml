apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: shop
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
{{- if eq .Vars.sidecar "yes" }}
        - name: heartbeat
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://127.0.0.1/ || echo heartbeat failed; sleep 10; done"]
{{- end }}
