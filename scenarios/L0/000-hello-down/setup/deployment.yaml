apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: {{ .Namespace }}
  labels:
    app: hello
    team: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
        team: frontend
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: {{ .Vars.image }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
