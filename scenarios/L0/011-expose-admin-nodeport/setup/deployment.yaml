apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: backoffice
    track: stable
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
      track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: backoffice
        track: stable
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: {{ .Vars.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: admin-html
        - name: nginx-conf
          configMap:
            name: admin-nginx
{{ if eq .Vars.canary "true" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-canary
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/part-of: backoffice
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
      track: canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/part-of: backoffice
        track: canary
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: {{ .Vars.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: admin-canary-html
        - name: nginx-conf
          configMap:
            name: admin-nginx
{{ end }}
