apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Namespace }}
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: billing
    team: billing
spec:
  replicas: 2
  minReadySeconds: 5
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: billing
        team: billing
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: api
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ ! -r /etc/secrets/db-password ]; then
                echo "api: cannot read /etc/secrets/db-password"
                echo "api: no database password, exiting in 45s"
                sleep 45
                exit 1
              fi
              echo "api: connected"
              touch /tmp/ready
              while true; do sleep 3600; done
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 2
          volumeMounts:
            - name: db-credentials
              mountPath: {{ .Vars.mount_path }}
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: db-credentials
          secret:
            secretName: {{ .Vars.secret_ref }}
