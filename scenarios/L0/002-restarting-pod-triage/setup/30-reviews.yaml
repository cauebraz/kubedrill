apiVersion: apps/v1
kind: Deployment
metadata:
  name: reviews
  namespace: {{ .Namespace }}
  labels:
    app: reviews
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reviews
  template:
    metadata:
      labels:
        app: reviews
        app.kubernetes.io/part-of: shop
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c"]
          args:
            - |
              n=0
              while [ ! -f /etc/reviews/reviews.conf ]; do
                n=$((n + 1))
                if [ "$n" -ge 10 ]; then
                  echo "reviews: /etc/reviews/reviews.conf not found after 10s, giving up"
                  exit 1
                fi
                sleep 1
              done
              . /etc/reviews/reviews.conf
              echo "reviews: warming the review cache ($CACHE_MB MiB)"
              cache=$(head -c $((CACHE_MB * 1024 * 1024)) /dev/zero | tr '\0' x)
              echo "reviews: cache ready (${#cache} bytes), serving on :8080"
              httpd -f -p 8080 -h /www
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Vars.liveness_port }}
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: {{ .Vars.memory_limit }}
          volumeMounts:
            - name: pages
              mountPath: /www
              readOnly: true
            - name: config
              mountPath: {{ .Vars.config_mount }}
              readOnly: true
      volumes:
        - name: pages
          configMap:
            name: shop-pages
        - name: config
          configMap:
            name: reviews-config
