apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: {{ .Namespace }}
  labels:
    app: storefront
    app.kubernetes.io/part-of: shop
spec:
  replicas: 4
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
        app.kubernetes.io/part-of: shop
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: pages
              mountPath: /www
              readOnly: true
      volumes:
        - name: pages
          configMap:
            name: shop-pages
---
