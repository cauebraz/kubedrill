checks:
  - id: pod-labeled
    description: exactly one pod in the namespace carries the label triage=yes
    why: >-
      The on-call dashboard lists the pods labeled triage=yes; with none the
      restart alert keeps paging, and with two the team opens the wrong pod
      first.
    resource:
      apiVersion: v1
      kind: Pod
      namespace: "{{ .Namespace }}"
      selector: triage=yes
    path: "{.items[*].metadata.name}"
    matches: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"

  - id: label-on-right-pod
    description: the pod labeled triage=yes is a pod of the service that was restarting
    why: >-
      The label is a pointer for the team that takes over; on a healthy pod
      it sends them to the wrong service, and on a pod that a rollout
      already replaced it points at nothing. Label the pod that runs now.
    depends_on: [pod-labeled]
    script: >-
      app=$(kubectl -n {{ .Namespace }} get pods -l triage=yes
      -o jsonpath='{.items[*].metadata.labels.app}');
      [ "$app" = "reviews" ]
    exit_code: 0

  - id: restarts-zero
    description: the service that was restarting runs one pod with 0 restarts that has stayed up at least 45 seconds
    why: >-
      A restart count that grows means the kubelet keeps replacing the
      container; one pod of this service with 0 restarts after 45 seconds,
      longer than a failing liveness probe takes to kill it, is the proof
      that the cause is gone, not only the symptom.
    weight: 2
    script: |
      pods=$(kubectl -n {{ .Namespace }} get pods -l app=reviews -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.containerStatuses[0].restartCount}{" "}{.status.containerStatuses[0].state.running.startedAt}{"\n"}{end}')
      printf '%s\n' "$pods" | awk -v now="$(date -u +%s)" '
      function epoch(t,  y, m, d, era, yoe, mm, doe) {
        y = substr(t, 1, 4) + 0; m = substr(t, 6, 2) + 0; d = substr(t, 9, 2) + 0
        if (m <= 2) y--
        era = int(y / 400); yoe = y - era * 400
        mm = (m > 2) ? m - 3 : m + 9
        doe = yoe * 365 + int(yoe / 4) - int(yoe / 100) + int((153 * mm + 2) / 5) + d - 1
        return (era * 146097 + doe - 719468) * 86400 + substr(t, 12, 2) * 3600 + substr(t, 15, 2) * 60 + substr(t, 18, 2)
      }
      NF { n++; name = $1; restarts = $2; started = $3 }
      END {
        if (n != 1) { printf "%d reviews pods, expected 1\n", n; exit 1 }
        if (restarts != "0") { printf "%s: %s restarts, expected 0\n", name, restarts; exit 1 }
        if (started == "") { printf "%s: container web is not running\n", name; exit 1 }
        up = now - epoch(started)
        printf "%s: 0 restarts, up %ds\n", name, up
        if (up < 45) { print "expected at least 45s up with 0 restarts"; exit 1 }
      }'
    exit_code: 0

  - id: pod-ready
    description: the service that was restarting has its pod Running and Ready
    why: >-
      A pod that is Running but not Ready gets no traffic; Ready means the
      container started, stayed up and answers its readiness probe.
    depends_on: [restarts-zero]
    resource:
      apiVersion: v1
      kind: Pod
      namespace: "{{ .Namespace }}"
      selector: app=reviews
    path: "{.items[*].status.conditions[?(@.type=='Ready')].status}"
    equals: "True"

  - id: rolled-out
    description: "the service that was restarting finished rolling out: every pod runs the current template"
    why: >-
      Old pods that still pass readiness keep the ready count up while a
      broken new template crash-loops; only a finished rollout proves every
      pod runs the current template.
    depends_on: [restarts-zero]
    rollout:
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: reviews

  - id: liveness-kept
    description: the service that was restarting keeps a liveness probe
    why: >-
      Without a liveness probe the kubelet never restarts a reviews
      container that hangs while still running; the restarts stop, but a
      stuck process then keeps its pod until someone notices.
    depends_on: [restarts-zero]
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: reviews
    path: '{.spec.template.spec.containers[?(@.name=="web")].livenessProbe}'
    not_empty: true

  - id: memory-limit-kept
    description: the service that was restarting keeps a memory limit
    why: >-
      Without a memory limit a reviews container that leaks takes memory
      from the 39 other pods on the node until the kernel kills one of
      them; every service in the namespace runs with a limit.
    depends_on: [restarts-zero]
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: reviews
    path: '{.spec.template.spec.containers[?(@.name=="web")].resources.limits.memory}'
    not_empty: true

  - id: fleet-healthy
    description: every deployment in the namespace has all its replicas available (14 deployments, 40 pods)
    why: >-
      The other 39 pods were fine when the ticket came in; a fix that scales,
      deletes or breaks a neighbor trades one alert for another.
    script: >-
      kubectl -n {{ .Namespace }} get deployments -o
      jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.replicas}{" "}{.status.availableReplicas}{"\n"}{end}'
      | awk '{ n++; want += $2; if ($3 == "") $3 = 0;
      if ($2 != $3) { printf "%s: %s of %s available\n", $1, $3, $2; bad = 1 } }
      END { if (n != 14 || want != 40) { printf "%d deployments with %d replicas, expected 14 with 40\n", n, want; bad = 1 }
      exit bad }'
    exit_code: 0
