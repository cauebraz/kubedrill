[scenario]
id = "003-image-inventory"
title = "Ops wants a one-liner: list every image running in shop into a ConfigMap inventory"
level = "L0"
module = "L0.1"
type = "build"
minutes = 10
namespace = "shop"
exam = ["CKA:troubleshooting"]
concepts = ["image-pull", "pod-lifecycle"]
fix_targets = ["core/configmaps/inventory"]
