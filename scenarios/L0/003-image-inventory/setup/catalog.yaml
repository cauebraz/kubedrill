apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: shop
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: api
          image: {{ .Vars.catalog }}
          args: ["netexec", "--http-port=8080"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
