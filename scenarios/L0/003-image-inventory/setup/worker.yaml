apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: shop
    spec:
      terminationGracePeriodSeconds: 1
      initContainers:
        - name: warm-cache
          image: {{ .Vars.init }}
          command: ["sh", "-c", "echo warming the catalog cache"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: worker
          image: {{ .Vars.worker }}
          args: ["pause"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
