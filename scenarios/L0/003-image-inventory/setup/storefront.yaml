apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: shop
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: {{ .Vars.storefront }}
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
