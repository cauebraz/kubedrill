apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Namespace }}
  labels:
    app: frontend
    app.kubernetes.io/part-of: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: frontend
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                if wget -q -O /dev/null -T 3 http://cart/; then
                  echo "$(date -u +%H:%M:%S) GET http://cart/ -> ok"
                else
                  echo "$(date -u +%H:%M:%S) GET http://cart/ -> failed, checkout shows a timeout"
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
