checks:
  - id: cart-ready
    description: deployment cart has 2 ready replicas
    why: >-
      readyReplicas counts pods whose Ready condition is true. The ticket
      starts with 2, so a lower number here means the change replaced the
      cart pods with ones that do not answer their probe, or removed them.
    weight: 1
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: cart
    path: "{.status.readyReplicas}"
    equals: "2"

  - id: cart-endpoints
    description: service cart lists at least one endpoint
    why: >-
      The EndpointSlice of a Service holds the addresses of the pods its
      selector matches. An empty slice means no pod in the namespace carries
      every label the selector names, so kube-proxy has nowhere to send the
      traffic and rejects every connection to the Service.
    depends_on: [cart-ready]
    resource:
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      namespace: "{{ .Namespace }}"
      selector: kubernetes.io/service-name=cart
    path: "{.items[*].endpoints[*].addresses[*]}"
    not_empty: true

  - id: cart-ready-endpoints
    description: service cart has at least one ready endpoint
    why: >-
      kube-proxy programs only the addresses whose conditions.ready is true.
      An endpoint that is listed but not ready still receives no traffic, so
      this is the number of pods the Service name reaches.
    depends_on: [cart-endpoints]
    critical: true
    weight: 2
    resource:
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      namespace: "{{ .Namespace }}"
      selector: kubernetes.io/service-name=cart
    path: "{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}"
    not_empty: true

  - id: cart-page-served
    description: the cart page is served through service cart from inside the cluster
    why: >-
      Ready endpoints prove the selector matches Ready pods, not that a
      request arrives. A request to the Service name is what the frontend
      does, and it also walks the mapping from the Service port to the port
      the container listens on.
    depends_on: [cart-ready-endpoints]
    weight: 2
    probe:
      image: curlimages/curl:8.14.1@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
      command: ["curl", "-fsS", "-m", "5", "http://cart.{{ .Namespace }}.svc/"]
      timeout: 30s
    contains: "Welcome to nginx!"

  - id: cart-rolled-out
    description: "deployment cart finished rolling out: every pod runs the current template"
    why: >-
      Old pods that still pass readiness keep the ready count up while a
      broken new template crash-loops; only a finished rollout proves every
      pod runs the current template.
    depends_on: [cart-page-served]
    rollout:
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: cart

  - id: selector-matches-template
    description: service cart selects the pods that deployment cart creates
    why: >-
      Labels set by hand on running pods, or pods kept alive outside the
      Deployment, vanish with the next rollout; only a selector that the pod
      template satisfies keeps the Service routing after every deploy.
    depends_on: [cart-page-served]
    spoiler: true
    script: |
      sel=$(kubectl -n "$TASK_NS" get service cart -o jsonpath='{.spec.selector}')
      tpl=$(kubectl -n "$TASK_NS" get deployment cart -o jsonpath='{.spec.template.metadata.labels}')
      pairs() { printf '%s' "$1" | tr -d '{}"' | tr ',' '\n' | sed 's/:/=/'; }
      if [ -z "$sel" ]; then
        echo "service cart has no selector"
        exit 1
      fi
      have=" $(pairs "$tpl" | tr '\n' ' ') "
      missing=""
      for p in $(pairs "$sel"); do
        case "$have" in *" $p "*) ;; *) missing="$missing $p" ;; esac
      done
      if [ -n "$missing" ]; then
        echo "service cart selects$missing, which the pod template of deployment cart does not set"
        exit 1
      fi
      echo "every selector label of service cart is set by the pod template of deployment cart"
    exit_code: 0
