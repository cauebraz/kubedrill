apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: payments
    team: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: payments
        team: payments
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: worker
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
{{- if eq .Vars.worker_source "file" }}
          command: ["sh", "-c", "echo \"payments worker up, token length $(wc -c < /etc/payments/token)\"; while true; do sleep 5; done"]
          volumeMounts:
            - name: token
              mountPath: /etc/payments
              readOnly: true
{{- else }}
          command: ["sh", "-c", "echo \"payments worker up, token length ${#API_TOKEN}\"; while true; do sleep 5; done"]
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Vars.worker_secret }}
                  key: token
{{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
{{- if eq .Vars.worker_source "file" }}
      volumes:
        - name: token
          secret:
            secretName: {{ .Vars.worker_secret }}
{{- end }}
