apiVersion: v1
kind: Secret
metadata:
  name: payments-token-old
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: payments
  annotations:
    payments.acme.example/note: copy of payments-token taken before the rotation, just in case
type: Opaque
stringData:
  token: {{ .Vars.old_token }}
