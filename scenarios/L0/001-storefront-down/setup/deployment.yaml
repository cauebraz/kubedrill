apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: shop
    team: storefront
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: shop
        team: storefront
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: {{ .Vars.image }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: storefront-html
