checks:
  - id: deploy-exists
    description: deployment catalog exists
    why: >-
      The storefront, the dashboards and the on-call runbook all look for a
      Deployment named catalog in this namespace; while it is missing nothing
      else in this list can be graded.
    critical: true
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: catalog
    exists: true

  - id: ready-replicas
    description: deployment catalog has 2 ready replicas
    why: >-
      readyReplicas counts pods whose Ready condition is true; the same
      condition is what puts a pod IP into the Service's EndpointSlices, so
      fewer than 2 here means the catalog runs below the agreed capacity.
    depends_on: [deploy-exists]
    weight: 2
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: catalog
    path: "{.status.readyReplicas}"
    equals: "2"

  - id: service-endpoints
    description: service catalog has at least one ready endpoint
    why: >-
      A Service is only a selector; EndpointSlices hold the pod IPs that are
      Ready and match it. With no ready endpoint kube-proxy rejects every
      connection to http://catalog/ (connection refused) and the storefront's
      catalog panel stays empty.
    depends_on: [ready-replicas]
    resource:
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      namespace: "{{ .Namespace }}"
      selector: kubernetes.io/service-name=catalog
    path: "{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}"
    not_empty: true

  - id: page-served
    description: service catalog serves the ACME Catalog 3.2.0 page
    why: >-
      A ready endpoint proves a pod matched and passed its probe, not that a
      request through the Service reaches the port nginx listens on; this
      in-cluster request is what the storefront does, and the body proves the
      catalog build is the one mounted.
    depends_on: [service-endpoints]
    probe:
      image: curlimages/curl:8.14.1@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
      command: ["curl", "-fsS", "-m", "5", "http://catalog.{{ .Namespace }}.svc/"]
      timeout: 30s
    contains: "ACME Catalog 3.2.0"

  - id: no-stray-deployment
    description: no deployment other than catalog and storefront remains in the namespace
    why: >-
      A Deployment left behind keeps its pods running and the next person
      reading the namespace cannot tell which catalog is real; the shop
      namespace owns exactly two Deployments, catalog and storefront.
    depends_on: [deploy-exists]
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      selector: app.kubernetes.io/name
    path: "{.items[*].metadata.name}"
    matches: "^(catalog|storefront)( (catalog|storefront))*$"
