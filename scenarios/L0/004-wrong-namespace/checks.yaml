checks:
  - id: page-served
    description: service catalog serves the ACME Catalog 3.2.0 page
    why: >-
      This in-cluster request through the Service is what the storefront
      does; while it fails the catalog panel stays empty, and the body
      proves the catalog build is the one mounted.
    critical: true
    probe:
      image: curlimages/curl:8.14.1@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
      command: ["curl", "-fsS", "-m", "5", "http://catalog.{{ .Namespace }}.svc/"]
      timeout: 30s
    contains: "ACME Catalog 3.2.0"

  - id: service-endpoints
    description: service catalog has at least one ready endpoint
    why: >-
      A Service is only a selector; its EndpointSlices list the pod IPs that
      match it and mark which are Ready. With no ready endpoint kube-proxy
      rejects every connection to http://catalog/ (connection refused) and
      the storefront's catalog panel stays empty.
    depends_on: [page-served]
    resource:
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      namespace: "{{ .Namespace }}"
      selector: kubernetes.io/service-name=catalog
    path: "{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}"
    not_empty: true

  - id: deploy-exists
    description: deployment catalog exists
    why: >-
      The storefront, the dashboards and the on-call runbook all look for a
      Deployment named catalog in this namespace; a catalog that serves
      under any other name is invisible to all of them.
    depends_on: [page-served]
    critical: true
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: catalog
    exists: true

  - id: ready-replicas
    description: deployment catalog has 2 ready replicas
    why: >-
      readyReplicas counts pods whose Ready condition is true; the same
      condition marks a pod IP ready in the Service's EndpointSlices, so
      fewer than 2 here means the catalog runs below the agreed capacity.
    depends_on: [deploy-exists]
    weight: 2
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: catalog
    path: "{.status.readyReplicas}"
    equals: "2"

  - id: catalog-rolled-out
    description: "deployment catalog finished rolling out: every pod runs the current template"
    why: >-
      Old pods that still pass readiness keep the ready count up while a
      broken new template crash-loops; only a finished rollout proves every
      pod runs the current template.
    depends_on: [ready-replicas]
    rollout:
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: catalog

  - id: no-stray-deployment
    description: no deployment other than catalog and storefront remains in the namespace
    why: >-
      A Deployment left behind keeps its pods running and the next person
      reading the namespace cannot tell which catalog is real; the shop
      namespace owns exactly two Deployments, catalog and storefront.
    depends_on: [page-served]
    script: >-
      names=$(kubectl -n {{ .Namespace }} get deployments
      -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sort | tr '\n' ' ');
      echo "deployments: $names";
      [ "$names" = "catalog storefront " ]
    exit_code: 0
