apiVersion: apps/v1
kind: Deployment
metadata:
  name: statuscheck
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: statuscheck
    app.kubernetes.io/part-of: portal
    team: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: statuscheck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statuscheck
        app.kubernetes.io/part-of: portal
        team: platform
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: statuscheck
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                if out=$(wget -q -O /dev/null -T 3 http://edge/ 2>&1); then
                  echo "$(date -u +%H:%M:%S) GET http://edge/ -> ok"
                else
                  echo "$(date -u +%H:%M:%S) GET http://edge/ -> failed: $out"
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
