apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-nginx
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: portal
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        location = /healthz {
            add_header Content-Type text/plain;
            return 200 'ok\n';
        }
        location / {
            proxy_pass http://web:80/;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream off;
        }
    }
