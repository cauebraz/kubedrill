apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: portal
    app.kubernetes.io/version: 3.2.0
    team: docs
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: portal
        app.kubernetes.io/version: 3.2.0
        team: docs
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: nginx
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: {{ .Vars.port_name }}
              containerPort: {{ .Vars.container_port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Vars.probe_port }}
            periodSeconds: 5
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: web-html
        - name: nginx-conf
          configMap:
            name: web-nginx
