apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: billing
    team: billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: billing
        team: billing
    spec:
      terminationGracePeriodSeconds: 1
      initContainers:
        - name: migrate
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "-c"]
          args:
            - |
              until nc -z -w 2 "$DB_HOST" "$DB_PORT"; do
                echo "waiting for database at $DB_HOST:$DB_PORT"
                sleep 2
              done
              echo "database reachable at $DB_HOST:$DB_PORT"
              until [ -f "$MIGRATE_FLAG" ]; do
                echo "waiting for migration flag $MIGRATE_FLAG"
                sleep 2
              done
              echo "schema $(cat "$MIGRATE_FLAG") ready, migrations done"
          env:
            - name: DB_HOST
              value: "{{ .Vars.db_host }}"
            - name: DB_PORT
              value: "{{ .Vars.db_port }}"
            - name: MIGRATE_FLAG
              value: /etc/migrate/schema-ready
          volumeMounts:
            - name: migrate-config
              mountPath: {{ .Vars.mount_path }}
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: api
          image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: migrate-config
          configMap:
            name: migrate-config
