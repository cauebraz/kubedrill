apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db
        app.kubernetes.io/part-of: billing
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: postgres
          image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
          args: ["netexec", "--http-port=5432"]
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: postgres
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
