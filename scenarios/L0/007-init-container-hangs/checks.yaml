checks:
  - id: db-ready
    description: deployment db has 1 ready replica
    why: >-
      The migration waits for the database before anything else starts; with
      no Ready db pod every api fix keeps waiting, so this is the first fact
      to settle.
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: db
    path: "{.status.readyReplicas}"
    equals: "1"

  - id: db-port-kept
    description: service db exposes port 5432
    why: >-
      Other teams' services connect to db on 5432; moving the Service to
      the port a migration asks for fixes api and breaks every other client
      of the database.
    resource:
      apiVersion: v1
      kind: Service
      namespace: "{{ .Namespace }}"
      name: db
    path: "{.spec.ports[*].port}"
    matches: "(^| )5432( |$)"

  - id: api-ready
    description: deployment api has 2 ready replicas
    why: >-
      readyReplicas counts pods whose Ready condition is true; a pod whose
      init container is still running has no app container at all, so 0 here
      means no api anywhere, not a slow one.
    critical: true
    weight: 2
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: api
    path: "{.status.readyReplicas}"
    equals: "2"

  - id: api-rolled-out
    description: "deployment api finished rolling out: every pod runs the current template"
    why: >-
      Old pods that still pass readiness keep the ready count up while a
      broken new template crash-loops; only a finished rollout proves every
      pod runs the current template.
    depends_on: [api-ready]
    rollout:
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: api

  - id: migrate-completes
    description: every api pod runs the migrate init container to completion
    why: >-
      The app expects the schema the migrations apply; an api pod that
      starts without a completed migrate step, or with a migrate step that
      no longer waits for the database and the flag, fails on the first
      real query.
    depends_on: [api-ready]
    script: |
      init=$(kubectl -n {{ .Namespace }} get deployment api -o jsonpath='{.spec.template.spec.initContainers[*].name}')
      echo "deployment api init containers: ${init:-none}"
      case " $init " in *" migrate "*) ;; *) exit 1 ;; esac
      sum=$(kubectl -n {{ .Namespace }} get deployment api -o jsonpath='{.spec.template.spec.initContainers[?(@.name=="migrate")].command}{.spec.template.spec.initContainers[?(@.name=="migrate")].args}' | cksum | cut -d' ' -f1)
      if [ "$sum" != "1650378757" ]; then
        echo "init container migrate: command or loop differs from the one the team ships"
        exit 1
      fi
      pods=$(kubectl -n {{ .Namespace }} get pods -l app.kubernetes.io/name=api -o jsonpath='{range .items[*]}{.metadata.name}{" deleting="}{.metadata.deletionTimestamp}{" migrate="}{.status.initContainerStatuses[?(@.name=="migrate")].state.terminated.reason}{"\n"}{end}')
      printf '%s\n' "$pods" | awk '
      NF && $2 == "deleting=" { n++; r = substr($3, 9); if (r != "Completed") { printf "%s: migrate %s, expected Completed\n", $1, (r == "" ? "not completed" : r); bad = 1 } else { printf "%s: migrate Completed\n", $1 } }
      END { if (n == 0) { print "no running api pod"; exit 1 } exit bad }' || exit 1
      for p in $(printf '%s\n' "$pods" | awk 'NF && $2 == "deleting=" { print $1 }'); do
        log=$(kubectl -n {{ .Namespace }} logs "$p" -c migrate 2>/dev/null)
        case "$log" in
          *"database reachable at "*":5432"*) ;;
          *) echo "$p: migrate never reached the database on port 5432"; exit 1 ;;
        esac
        case "$log" in
          *"schema 12 ready, migrations done"*) ;;
          *) echo "$p: migrate never read the schema flag of migrate-config"; exit 1 ;;
        esac
      done
    exit_code: 0

  - id: api-endpoints
    description: service api has at least one ready endpoint
    why: >-
      A Service only routes to pods that are Ready; with no ready endpoint
      kube-proxy refuses every connection to api, and every caller in the
      cluster gets connection refused.
    depends_on: [api-ready]
    resource:
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      namespace: "{{ .Namespace }}"
      selector: kubernetes.io/service-name=api
    path: "{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}"
    not_empty: true

  - id: api-serves
    description: service api answers 200 to an in-cluster request
    why: >-
      Ready endpoints prove the kubelet's probe passed; a request through
      the Service is what the other teams' pods do, and the status code is
      what their clients act on.
    depends_on: [api-endpoints]
    probe:
      image: curlimages/curl:8.14.1@sha256:9a1ed35addb45476afa911696297f8e115993df459278ed036182dd2cd22b67b
      command: ["curl", "-sS", "-m", "5", "-o", "/dev/null", "-w", "%{http_code}", "http://api.{{ .Namespace }}.svc/"]
      timeout: 30s
    equals: "200"
