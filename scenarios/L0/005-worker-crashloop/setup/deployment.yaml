apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Namespace }}
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: billing
    team: billing
spec:
  replicas: 2
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: billing
        team: billing
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: worker
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ["sh", "/opt/worker/run.sh"]
          args: ["{{ .Vars.flag }}"]
          envFrom:
            - configMapRef:
                name: worker-env
            - secretRef:
                name: worker-token
          volumeMounts:
            - name: files
              mountPath: /opt/worker/run.sh
              subPath: run.sh
              readOnly: true
            - name: files
              mountPath: /etc/worker/worker.conf
              subPath: {{ .Vars.conf_subpath }}
              readOnly: true
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/worker.ready"]
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: files
          configMap:
            name: worker-files
