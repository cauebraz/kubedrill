checks:
  - id: deploy-exists
    description: deployment worker exists
    why: >-
      The Deployment is the object the billing team deploys from; if it is
      gone, nothing below it (ReplicaSet, pods) can recover and the fix is a
      redeploy, not a patch.
    critical: true
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: worker
    exists: true

  - id: ready-replicas
    description: deployment worker has 2 ready replicas
    why: >-
      readyReplicas counts pods whose Ready condition is true; the worker
      reports Ready only after it has read its configuration and started
      polling, so 0 here means no invoice is being processed.
    depends_on: [deploy-exists]
    weight: 2
    critical: true
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: worker
    path: "{.status.readyReplicas}"
    equals: "2"

  - id: available-replicas
    description: deployment worker has 2 replicas available for at least 5 seconds
    why: >-
      availableReplicas counts pods that stayed Ready for minReadySeconds (5);
      a container that starts, reports Ready and exits again shows up in
      readyReplicas for a moment but never here, so this is the number that
      says the crash loop is over.
    depends_on: [ready-replicas]
    resource:
      apiVersion: apps/v1
      kind: Deployment
      namespace: "{{ .Namespace }}"
      name: worker
    path: "{.status.availableReplicas}"
    equals: "2"

  - id: script-unchanged
    description: the worker runs the run.sh the team ships, unchanged
    why: >-
      The same run.sh runs in staging and production; an edited copy in one
      namespace makes the next deploy overwrite the fix and hides the input
      mismatch that broke this one.
    depends_on: [deploy-exists]
    script: |
      sum=$(kubectl -n {{ .Namespace }} get configmap worker-files -o jsonpath='{.data.run\.sh}' | cksum | cut -d' ' -f1)
      cmd=$(kubectl -n {{ .Namespace }} get deployment worker -o jsonpath='{.spec.template.spec.containers[?(@.name=="worker")].command}')
      if [ "$sum" = "3657645302" ]; then state=unchanged; else state=changed; fi
      printf 'run.sh %s, command %s\n' "$state" "$cmd"
    equals: 'run.sh unchanged, command ["sh","/opt/worker/run.sh"]'

  - id: worker-log
    description: the worker pods log "worker started"
    why: >-
      The worker prints "worker started" once it has its queue address, its
      token and its config file; a pod that is Ready but never printed it is
      running something other than the worker the team ships.
    depends_on: [ready-replicas]
    script: kubectl -n {{ .Namespace }} logs -l app.kubernetes.io/name=worker --tail=20 | grep -q 'worker started'
    exit_code: 0
