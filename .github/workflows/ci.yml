name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: shellcheck --version
      - name: shellcheck the files just shellcheck scans
        run: find scenarios -name '*.sh' -exec shellcheck -x start.sh workstation/entrypoint.sh workstation/bashrc {} +
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - run: go build -o bin/kubedrill ./cmd/kubedrill
      - run: go mod tidy -diff
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: ./bin/kubedrill lint

  smoke:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Render the base profile
        run: |
          go run ./cmd/kubedrill profile render --out "$RUNNER_TEMP/kind.yaml"
          if grep -qF '{{' "$RUNNER_TEMP/kind.yaml"; then exit 1; fi
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: kubedrill
          config: ${{ runner.temp }}/kind.yaml
      - run: go build -o bin/kubedrill ./cmd/kubedrill
      - run: ./bin/kubedrill smoke
